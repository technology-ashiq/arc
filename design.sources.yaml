# design.sources.yaml -- the one source registry for the design lane (ADR-1408).
#
# WHAT THIS IS. "Which sources may we use, for what, at what cost" lived in prose across three
# files in Cycle 3, so no gate could read it and no run could be held to it. This file is that
# answer in a typed form, and `design-sources-lint.mjs` makes it a permission surface rather
# than a note.
#
# ONLY THE OWNER ADDS ENTRIES. Same reasoning as lane birth: a machine that can add its own
# permitted sources has no permission model at all. `approved_by` is linted against the owner,
# and an entry approved by anyone else is refused.
#
# STATUS vs AVAILABILITY are separate on purpose and must stay that way. `status` is what the
# owner INTENDS (active / trial / off). `availability` is what the last run OBSERVED, and it is
# written by the runner, never by hand -- collapsing them would let a network failure look like
# a policy decision.
#
# BLOCK STYLE ONLY. Flow collections (`kind: [inspiration]`) are outside the frozen YAML subset
# this repo parses with (ADR-0200); written that way the file parses to a differently-shaped
# document, or not at all.
#
# THE ROWS BELOW ARE ADR-1412's, and they were decided by reading each site's robots.txt and
# terms -- not by how good the gallery looks. Four of the prettiest sources here are off, and
# that is the decision working rather than failing.

sources:
  # ---- active: fetchable, server-rendered, robots permits ----
  - id: lapa-ninja
    kind:
      - inspiration
    access: fetch
    hosts:
      - lapa.ninja
    allowed_use:
      - reference-pack
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # robots.txt: `Allow: /`, only `/api/` disallowed. Server-rendered, so a plain fetch
    # returns real HTML rather than a JS shell.
    # OFF 2026-09-27 (owner, ADR-1412 amendment): the first real pack build found its Cloudflare
    # answering robots.txt with 403 to ClaudeBot and Claude-User, while a browser agent gets
    # through. That is the site refusing Claude, and a borrowed agent string would be evasion.

  - id: saasframe
    kind:
      - inspiration
    access: fetch
    hosts:
      - saasframe.io
    allowed_use:
      - reference-pack
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # robots.txt: the generic `*` group disallows only query URLs. Server-rendered, no JS
    # needed for the screens we read.
    # OFF 2026-09-27 (owner, ADR-1412 amendment): browsing works, but every screenshot is served
    # from Webflow's shared CDN (cdn.prod.website-files.com), never from saasframe.io. That host
    # is not this row's, it is shared by every Webflow site, and its robots.txt answers 403, so
    # permission is unknown for every image this gallery shows.

  # ---- active since 2026-09-27 (owner, ADR-1412 amendment): the replacements ----
  - id: nicelydone
    kind:
      - inspiration
    access: fetch
    hosts:
      - nicelydone.club
    allowed_use:
      - reference-pack
      - provenance
    auth: none
    cost: free
    status: active
    availability: unknown
    approved_by: ashiq
    added: 2026-09-27
    # Screens from shipped SaaS products, the closest fit to an app workspace. robots.txt is
    # plain text and allows ClaudeBot and Claude-User; images are served from its own host. No
    # terms page at the usual paths (checked 2026-09-27).

  - id: collectui
    kind:
      - inspiration
    access: fetch
    hosts:
      - collectui.com
    allowed_use:
      - reference-pack
      - provenance
    auth: none
    cost: free
    status: active
    availability: unknown
    approved_by: ashiq
    added: 2026-09-27
    # UI collections by pattern (dashboards, tables, settings). robots.txt allows ClaudeBot and
    # Claude-User with no blanket disallow; most images are on its own host. Some shots are
    # concept work, so the curator prefers shipped products. No terms page at the usual paths.
    # Observed 2026-09-27: a client-rendered app, so a plain fetch reaches no screen URL.

  - id: saasui
    kind:
      - inspiration
    access: fetch
    hosts:
      - saasui.design
    allowed_use:
      - reference-pack
      - provenance
    auth: none
    cost: free
    status: active
    availability: unknown
    approved_by: ashiq
    added: 2026-09-27
    # SaaS product screens. Added by the owner on 2026-09-27 when collectui proved unreachable by
    # a plain fetch: robots.txt is plain text allowing ClaudeBot and Claude-User, and every image
    # on its homepage (51 of 51) is served from its own host.

  # ---- active, but citation only: permitted to link, never to cache ----
  - id: awwwards
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
      - link-only
    auth: none
    cost: free
    status: active
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # Terms forbid reproduction of its material. So: a provenance link is permitted and a local
    # image cache is not, which is an allowed_use fact rather than a status one -- ADR-1408
    # freezes the status enum, and `link-only` as a status would be a schema change smuggled in
    # as a value. `reference-pack` is deliberately absent: that is the use this source may not
    # serve, and the curator reads this list rather than a comment.

  # ---- off: excluded on permission grounds, not on taste ----
  - id: godly
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # robots.txt sets `ai-train=no` and names ClaudeBot under `Disallow: /`. Also a JS-only
    # shell, so even if permission existed a plain fetch would return nothing to read.

  - id: dribbble
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # Developer terms, verbatim: "Scraping, copying, saving, or storing our data is strictly
    # prohibited." An explicit anti-storage clause cannot sit inside an automated fetch path.

  - id: behance
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # robots.txt names ClaudeBot `Disallow: /`, and its edge infrastructure rate-limited a
    # single automated GET.

  - id: land-book
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # A Cloudflare bot challenge returns 403 for robots.txt ITSELF. Permission is therefore
    # unreadable, and unreadable permission is not permission.

  - id: page-collective
    kind:
      - inspiration
    access: fetch
    allowed_use:
      - provenance
    auth: none
    cost: free
    status: off
    availability: unknown
    approved_by: ashiq
    added: 2026-08-23
    # TLS handshake failed on two independent fetchers. This one is UNVERIFIED rather than
    # disallowed -- the distinction is kept because it may move to `trial` after a
    # headless-browser probe, and "we could not check" must not harden into "they said no".
