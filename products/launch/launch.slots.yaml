# launch.slots.yaml -- LAYER 1, the fixed process (ADR-1701). A slot is a contract: what must be provably true at
# exit. It never names a tool; tools live in launch.providers.yaml. Block style only (ADR-0200).
# Seeded 2026-10-03 by copying docs/strategy/plans/PLAN-launch.md catalog tables row for row (phase-00-spec C1b).
# Counts are derived by launch-coverage.mjs, never kept here. Adding a slot is an ADR plus a row plus a provider row.
slots:
  - id: domain
    group: identity
    tier: core
    exit_criteria:
      - "registered, WHOIS privacy; approval gate 1. Rehearsal: refusal path + --dry-run only"
    verify: domain-probe
    gate: gate-1
    approval: true
    sensitive_actions:
      - purchase
    timeout: 300
    resume: resources
    required_when: "always"
  - id: dns
    group: identity
    tier: core
    exit_criteria:
      - "resolves from 8.8.8.8 and 1.1.1.1"
    verify: dns-probe
    depends_on:
      - domain
      - hosting
    gate: none
    approval: false
    timeout: 300
    resume: resources
    required_when: "always"
  - id: tls
    group: identity
    tier: core
    exit_criteria:
      - "scanner grade ≥ A; HSTS"
    verify: tls-probe
    depends_on:
