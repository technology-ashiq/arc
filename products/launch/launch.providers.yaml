  - id: cloudflare-registrar
    slot: domain
    status: candidate
    fits:
      - saas-b2b
      - saas-b2c
      - api-product
    region: any
    payment_model: any
    env_keys:
      - CLOUDFLARE_API_TOKEN
    hosts:
      - api.cloudflare.com
    credentials:
      scope: "registrar read; purchase only behind gate-1"
    sensitive_actions:
      - purchase
    adapter: providers/domain/cloudflare-registrar.mjs
