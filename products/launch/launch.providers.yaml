# launch.providers.yaml -- LAYER 2: which tool may fill which slot (ADR-1701, ADR-1719). Block style only.
# OWNER-ONLY BIRTH (ADR-1702): approved_by is linted against the owner. These rows were SEEDED by the kickoff
# session on 2026-10-03 under the owner's standing instruction and land through a reviewed PR; every row is a
# candidate, and no candidate is ever recommended or run -- only a vetted row is (ADR-1703, ADR-1705).
# status = the owner's intent; last_verified = observed and runner-written. Never collapse the two.
