# engine/router.yaml -- task-class -> driver, hand-edited, forever in v1.
#
# THIS FILE IS THE IMPLEMENTATION OF A POLICY, NOT A POLICY.
# Tier definitions, the seat map and the prohibitions come from ADR-0069 (the Balanced Model
# Policy). This cycle decided ZERO new "which model where" questions -- ADR-0069 block (d)'s
# north-star is that the engine INHERITS them. If a routing question arises that ADR-0069
# does not already answer, that gap is the signal to amend the ADR, not to invent an answer
# here.
#
# NO AUTO-UPDATING (a declared no-go). Nothing writes to this file at run time. Every change
# is a reviewed diff citing ADR-0069, which is also block (b)(1)'s rule: no component may
# change a tier at run time, under any condition.
#
# Read by `arc-run --driver auto`. An unknown class exits non-zero naming the class AND this
# file, because the fix is always "edit this file", never "guess harder".

version: 1

# TIER -> CONCRETE MODEL, per driver. Without this block the tier was a LABEL: every class
# invoked its driver byte-identically, `high-judgment` and `balanced-workhorse` produced the
# same call, and the receipt's `model: tier:X` asserted something nothing had applied. That
# also made "escalation never changes a tier at run time" vacuously true -- editing this file
# did not change a tier either. Worse, the real knob was run-time env (ARC_LLM_MODEL), which
# is exactly the un-reviewed tier change ADR-0069 block (b)(1) forbids.
#
# These values are ADR-0069 block (a)'s "Implementation v1 (claude, 2026-08-02)" table, which
# already decided them. Encoding them here implements that policy; it decides nothing new,
# which is block (d)'s north-star for this cycle.
#
# A driver whose model does NOT come from this file records `model: unpinned` on its receipt
# rather than letting an environment variable escalate a run silently.
models:
  cheap-scan:
    claude-code: haiku
  balanced-workhorse:
    claude-code: sonnet
  high-judgment:
    claude-code: opus
  # codex and generic-api have no entry on purpose: ADR-0069's implementation v1 is a CLAUDE
  # mapping, and inventing model ids for other vendors here would be exactly the new
  # "which model where" fork this cycle is required not to make. Until a policy amendment
  # names them, those drivers run unpinned and say so.

# Tiers are provider-neutral by construction (Constitution A7). These names are the ones
# ADR-0069 block (a) defines; process-lint FAILs if a tier appears here that block (a) does
# not name, so this table cannot drift away from the policy it implements.
tiers:
  - cheap-scan
  - balanced-workhorse
  - high-judgment
  - independent-family-verifier

# A task class is a property of the WORK, not of a vendor. `fallback` is tried in order when
# the primary driver reports a driver-fault (never when it reports a process-fault -- falling
# back on a broken schema would just fail three times instead of once).
classes:
  commit-msg-draft:
    tier: balanced-workhorse
    driver: claude-code
    fallback:
      - codex
      - generic-api

  review-diff:
    # ADR-0069 block (a): grading other work is high-judgment -- it fails SILENTLY when
    # under-powered, which is exactly the condition worth paying for.
    tier: high-judgment
    driver: claude-code
    fallback:
      - codex

  kickoff-plan:
    tier: high-judgment
    driver: claude-code
    fallback: []

  # ===========================================================================================
  # THE HIRE (Cycle 7, REQ-04). This row is a hire, and the four fields below are its terms.
  # ===========================================================================================
  #
  # THE DECISION THAT MADE IT (ADR-0217 — a hire is a receipt, and the row cites it):
  #   mandate    decision.recorded 01KZTM348858PDH44K4HA64CVA   (the Build-out Mandate, 2026-08-09)
  #   this hire  decision.recorded 01KZYG5R1BB8BJ1R4MRFY5SP4M   (deciding approval.requested
  #                                                              01KZYG5QBAM1ZZQJK7J0ZG13AK)
  # Both verified present in .claude/state/hq/events/ and ABSENT from _quarantine/ before this row
  # was written — an exit-0 emitter is not evidence anything landed, and this lane has the
  # quarantined receipt to prove it.
  #
  # THE FOUR FIELDS ARE MANDATORY AND ENFORCED AT LOAD, not at dispatch (router-row.mjs). A row
  # missing any of them fails `arc-run` before it routes anything, because a row that only fails
  # when someone happens to use it sits wrong for as long as nobody does.
  #
  #   cap:        the ceiling this runtime may ever reach. L1-drafts is absolute this cycle: it
  #               PROPOSES, and a human copies anything out. A draft that publishes itself is an
  #               incident, not a feature.
  #   hosted:     local — the container runs on this machine against a local endpoint. The data
  #               boundary reads this field: an internal-only input against a `hosted: cloud` row
  #               is refused at routing (ADR-0219, arc-run exit 5).
  #   judge:      who accepts or rejects the output. Accept/reject plus one line, never a
  #               line-edit (ADR-0218) — arc verifies outcomes and never prescribes method.
  #   review_by:  tenure. Every hire is planned obsolescence (ADR-0216). Past this date the row is
  #               EXPIRED: dispatching through it refuses NAMING THE ROW and emits one idempotent
  #               rejustify-or-retire proposal, idempotent on (class, review_by).
  #
  #               TWO WEEKS, owner-ruled 2026-08-09 and written into ADR-0216 as "tight probation".
  #               CORRECTED 2026-08-17: this row shipped `2026-11-13` under a comment reading
  #               "Ninety days from the hire decision" -- 6.4x the period the owner actually ruled,
  #               asserted confidently by the comment that was supposed to carry the rule. Neither
  #               number was checked against the ADR until tenure was wired into the dispatch path
  #               and someone had to ask what the date meant. A comment stating a governance figure
  #               that contradicts its own ADR is the false-comment class applied to a decision
  #               record rather than to code, and it is the more expensive version: the code was
  #               enforcing nothing at all, so nothing could have caught it.
  #
  # NO `models:` ENTRY, and that is not an omission. ADR-0212 amends ADR-0069 so an agent runtime
  # OCCUPIES the model seat rather than being routed to one: `drivers/hermes version` reports the
  # pinned image digest plus a config hash whose preimage is named (the runtime config file, the
  # egress policy, the vetted skill list). Adding a tier→model mapping here would assert a routing
  # decision that nothing applies.
  #
  # NO FALLBACK, deliberately. Falling back from a capped, tenured, judged runtime to a model API
  # would silently route L1-drafts work through a row with none of those four terms — which is the
  # whole point of having them.
  #
  # TERMINATION SPEC (REQ-04). Two acts, in this order, and both are reviewed diffs:
  #   1. REVOKE THE CREDENTIAL first, at the provider. The key is the money bound; a disabled row
  #      with a live key still spends if anything else reaches the runtime.
  #   2. DISABLE THE ROW second — delete it, or set `driver:` to a driver that is not installed so
  #      the router refuses to load rather than silently re-routing. Do NOT merely change `cap:`;
  #      a lowered ceiling still dispatches.
  #   Termination is a repo edit citing this comment. Nothing terminates a hire at run time, for
  #   the same reason nothing promotes one: both are tier changes, and ADR-0069 b1 forbids them
  #   outside a reviewed diff.
  build-in-public-draft:
    tier: balanced-workhorse
    driver: hermes
    cap: L1-drafts
    hosted: local
    judge: ashiq
    review_by: 2026-08-31
    fallback: []

# The default for a process with no class row. Deliberately NOT a catch-all that silently
# works: `arc-run --driver auto` on an unknown class is an error, and this row only supplies
# the tier for one that is known but unrouted.
default:
  tier: balanced-workhorse
  driver: claude-code
  fallback: []
