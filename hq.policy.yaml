# hq.policy.yaml -- the human-declared CEILING (POL-A, ADR-0500..0507).
#
# This file is law. `policy-lint` FAILS FROM BIRTH on any violation: it is a validator, not an
# advisory lint, because a policy file that parses when it should not is a grant nobody
# authorised.
#
# Changing a ceiling here is a REPO EDIT in a reviewed diff -- never an agent action. The other
# key, the event-earned cap, is folded from the spine and can only rise by a human
# `policy.level.changed` citing trial-ledger evidence. effective = min(ceiling, cap).
#
# Every pair is born at L1. Nothing in this file grants execution by itself.

version: 1

# The adopted text this file quotes. policy-lint verifies the hash FIRST and only then parses
# E2 out of it -- a strict prose parser is safe exactly because its input is byte-pinned.
constitution:
  version: "1.0"
  sha256: "233a64961dc0a028ceca6b113405ead699f9185b39342924c32c05f9786b6ee6"
  receipt: "01KZ9V0QXNNMB3ZH18MSH8DKH3"

# The canonical semantics live HERE, not in a doc that describes them (POL-A: one source of
# truth). L4 is a parse error, superseding docs/strategy/arc-full-architecture.md:61,217.
levels:
  L0: "denied -- the capability is unavailable; no call is attempted"
  L1: "propose -- prepared and recorded, never executed; the birth level of every pair"
  L2: "bounded -- executes only within the bound declared in this grant"
  L3: "unbounded within the capability; human-granted only; never on a kind with a non-empty e2"

# Constitution E2, verbatim. Checked element-for-element against CONSTITUTION.md after its
# sha256 above is verified. A drifted quote fails the file.
ungrantable_actions:
  - "moving money"
  - "killing a venture"
  - "changing prices"
  - "unlocking real-money trading"
  - "publishing under Ashiq's name"

# E2's twin for TARGETS (ADR-0502). Excluded from every write grant AND every file-mutating
# shell grant, at every level, enforced by filesystem identity rather than string prefix --
# a hardlink has no canonical path for realpath to resolve to.
ungrantable_resources:
  - ".claude/settings.json"
  - ".claude/settings.local.json"
  - ".claude/hooks/**"
  - "hq.policy.yaml"

# Closed enums for the capabilities that have no live consumer yet. Empty is the honest state:
# a grammar written for a capability nobody calls is stale on arrival.
targets:
  message: []
  publish: []
  deploy: []

# ADR-0507 -- what each permitted program can REPRODUCE. "*" is the SEVEN non-shell
# capabilities; `shell` may never appear in a reproduces list, or effective(shell) would be
# defined in terms of itself. An argv0 in a kind's allowlist but absent from this table is a
# lint error, never an implicit narrow.
argv0_classes:
  node: { class: interpreter, reproduces: ["*"] }
  python: { class: interpreter, reproduces: ["*"] }
  python3: { class: interpreter, reproduces: ["*"] }
  bash: { class: interpreter, reproduces: ["*"] }
  sh: { class: interpreter, reproduces: ["*"] }
  pwsh: { class: interpreter, reproduces: ["*"] }
  npm: { class: interpreter, reproduces: ["*"] }
  npx: { class: interpreter, reproduces: ["*"] }
  git: { class: vcs, reproduces: ["write", "network"] }
  gh: { class: vcs, reproduces: ["write", "network"] }
  curl: { class: fetcher, reproduces: ["network"] }
  wget: { class: fetcher, reproduces: ["network"] }
  bats: { class: narrow, reproduces: [] }
  jq: { class: narrow, reproduces: [] }
  diff: { class: narrow, reproduces: [] }
  sha256sum: { class: narrow, reproduces: [] }

# The subject set. `process:NAME` resolves against processes/*.process.yaml; a kind absent from
# here is read-only at L1 and nothing else (POL-B). Nothing is granted above L1 today: the
# climb is event-earned, one human decision at a time, and this file is the ceiling those
# decisions may not exceed.
kinds:
  "session:interactive":
    e2: []
    read: { level: L3 }
    write: { level: L2, roots: ["initiatives/**", "docs/**", "tests/**", ".claude/scripts/**"] }
    shell: { level: L2, argv0_allow: ["git", "node", "bats", "jq", "gh"] }
    network: { level: L1 }
    message: { level: L0 }
    publish: { level: L0 }
    deploy: { level: L0 }
    spend: { level: L0 }

  "process:kickoff-plan":
    e2: []
    read: { level: L3 }
    write: { level: L2, roots: ["initiatives/**", "docs/adr/**"] }
    shell: { level: L1 }
    network: { level: L0 }
    message: { level: L0 }
    publish: { level: L0 }
    deploy: { level: L0 }
    spend: { level: L0 }

  "process:review-diff":
    e2: []
    read: { level: L3 }
    write: { level: L0 }
    shell: { level: L2, argv0_allow: ["git", "diff"] }
    network: { level: L0 }
    message: { level: L0 }
    publish: { level: L0 }
    deploy: { level: L0 }
    spend: { level: L0 }

  "process:commit-msg-draft":
    e2: []
    read: { level: L3 }
    write: { level: L0 }
    shell: { level: L2, argv0_allow: ["git"] }
    network: { level: L0 }
    message: { level: L0 }
    publish: { level: L0 }
    deploy: { level: L0 }
    spend: { level: L0 }
