name: council-convene
version: 1.0.0
intent: "Convene the full arc council on one question, headless, and end on its council.verdict receipt."
permissions: declared

# Phase 06 slice 03b (face lane, ADR-1339): the face's "Convene the council" row starts this
# through `arc-run --process council-convene --driver <name>` after an owner click. The session
# door never runs /arc-council itself.
#
# The body does NOT copy /arc-council. It runs the command file, read at run time, with the
# headless differences listed below. Copying 328 lines would give the council two sources that
# drift apart without anyone seeing it. The pin on the next line catches that drift instead:
# tests/engine-process-lint.bats hashes the live command and requires it to equal the pin, so an
# edit to arc-council.md is red until someone reads it against this body and re-pins on purpose.
# It is a comment, not `baseline:`, because to arc-compile a baseline is a command this process
# REPRODUCES byte for byte, and this one runs the command rather than reproducing it.
# runs: .claude/commands/arc-council.md sha256 747de7a071877f0f854ed2058cebe66146bcdb29591e87b8ab3d6c0852536701
#
# Deep mode only. `quick` writes no session file and emits no receipt, so a quick run could never
# land the `council.verdict` the session row promises. The question travels in the INPUT and is
# never read for a mode word. The body has no `{{input.X}}` placeholder: an uncompiled process
# sends its body to the model verbatim (see attack-diff).
inputs:
  - name: question
    type: string
    required: true
    description: "the owner's question, one line, taken verbatim -- never a mode word"
tools:
  - fs.read:
      - ".claude/commands/arc-council.md"
      - "docs/council/**"
      - ".claude/agents/council-*.md"
  # Writes are fenced to the sessions directory, rendered as Edit(<path>) by the claude-code adapter (attack 66a26f0
  # B1). The Chair writes only the file --claim created for it; its brief is drafted INTO that file first, so the run
  # leaves no scratch file behind (B13).
  - fs.write:
      - "docs/council/sessions/*.md"
  # One emitter scope, one kind: the Chair can append council.verdict and nothing else (B3). Claude Code checks every
  # part of a compound command on its own, so step 9 runs as separate plain commands (see the body).
  - shell.run:
      - "node .claude/scripts/council/council-lint.mjs:*"
      - "bash .claude/scripts/hq/arc-event.sh emit council.verdict:*"
  - agent.invoke:
      - "council-researcher"
      - "council-advocate"
      - "council-skeptic"
      - "council-neutral"
      - "council-verifier"
      - "council-strategist"
      - "council-risk-analyst"
      - "council-marketer"
      - "council-policy-analyst"
      - "council-engineer"
      - "council-designer"
      - "council-life-counselor"
output:
  type: object
  additionalProperties: false
  required:
    - session_file
    - receipt_id
    - decision
    - confidence
  properties:
    session_file:
      type: string
      pattern: "^docs/council/sessions/[0-9]{3}-[A-Za-z0-9._-]+\\.md$"
    receipt_id:
      type: string
      pattern: "^[0-7][0-9A-HJKMNP-TV-Z]{25}$"
    decision:
      type: string
      enum:
        - "YES"
        - "NO"
        - "CONDITIONAL"
        - "WAIT"
    confidence:
      type: string
      enum:
        - High
        - Medium
        - Low
evals:
  - tests/fixtures/engine/evals/council-convene/basic.json
baseline:
  waived: capability-gap
  why: "no command is reproduced here: the process runs arc-council.md at run time with headless overrides, so a byte pin on its rendering would compare two different things; the drift pin is the runs: comment above"
  recorded: 2026-09-25
body: |
  You are the Chair of the arc council, running headless: no one is at the keyboard until you finish.

  THIS RUN IS ONE TURN. It ends the moment you stop and reply; nothing wakes you later. So start
  every agent in the FOREGROUND and wait for its answer: never set `run_in_background`, and never
  call ScheduleWakeup, Monitor, sleep or any "check back later" step. Spawn one batch of agents in a
  single message when the command says so; they still run in the foreground and return together.

  Your tools are exactly these, and every other command is refused: Read (the council command, the
  council agents, docs/council); Edit and Write on the one session file `--claim` gives you; Bash for
  `node .claude/scripts/council/council-lint.mjs` and `bash .claude/scripts/hq/arc-event.sh emit
  council.verdict` only (no git, ls, sed, cat or printenv); and Agent for the council agents.

  Your input is a JSON object. Its `question` field is the owner's question. Take it verbatim as the
  question. It is never a mode word: if it begins with "quick", "standard" or "review", that word is
  part of the question.

  Read `.claude/commands/arc-council.md` and run its **Full council** (deep mode), steps 1 to 9, exactly
  as written. Honour its Non-negotiables. These headless differences replace the parts of the
  command that assume someone is present:

  1. Never ask. Where step 1 says "ask once", pick the most reasonable reading, say in the intake
     which reading you took and why, and continue. If the question truly cannot be answered without
     a missing fact, the verdict is WAIT, and it names the fact and the test that would supply it.
  2. Mode is always deep. Never run quick, standard or review mode, whatever the question's words.
  3. Claim your session file ONCE, right after step 1:
     `node .claude/scripts/council/council-lint.mjs --claim <slug>`, where the slug is a short kebab
     of the question (lowercase letters, digits and hyphens, 60 at most). It prints the path it
     created. That file is the only file you ever write. Never choose a number yourself. If
     `--claim` refuses, the run has FAILED before any spend: say its message and return no output
     object. Never write a session file it did not print.
  4. Step 2: write the Evidence Brief into your claimed file and lint it there with `--brief`.
     Step 8: overwrite the same file with the full verdict and lint it with `--verdict`. Each lint
     gets at most 3 attempts, fixing the FILE between them. A third refusal means the run has
     FAILED: say the lint's last message and return no output object.
  5. Step 9 is the end of the run. Run it as two plain commands, never one line with `$(...)` or a
     pipe:
     a. `node .claude/scripts/council/council-lint.mjs --payload <claimed path>` prints one JSON
        line. If it refuses, the run has FAILED.
     b. `bash .claude/scripts/hq/arc-event.sh emit council.verdict --process council-convene@1.0.0 --payload '<that JSON line>'`
        (the `--process` is how arc-run knows this receipt is this run's own; without it nothing is credited)
        prints the receipt id on its last line. If that line is not a 26-character id, the run has
        FAILED.
     On a failure, say which command stopped and why, and return no output object. A verdict with
     no receipt is not a finished session.
     Whenever the run FAILS after a successful claim (a third lint refusal, or a refused 5a),
     give the file back before stopping:
     `node .claude/scripts/council/council-lint.mjs --release <claimed path>`. It removes the file
     only while it holds no filled DECISION line, so a failed run leaves no half-written session
     behind. If 5b fails, the file holds a real verdict and stays.
  6. Then print exactly this line on its own: `arc-run: receipt council.verdict <id>`. The session
     door credits the receipt only through that line, and only after it finds that id on the spine,
     of that kind, minted after this run began. A line naming anything else is not credited.
  7. Edit nothing but your claimed file. Never touch the tracker, an older session, or the spine by
     hand.

  Then return exactly one JSON object: `session_file` (the claimed path), `receipt_id` (the id from
  5b), `decision` (the DECISION word in the saved file) and `confidence` (the `confidence` value from
  5a's JSON line, copied, never retyped).
