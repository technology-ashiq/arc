name: attack-diff
version: 1.0.0
intent: "Adversarially attack one surface of a diff with concrete breaking inputs, carrying the lane's fixed-defect patterns."
permissions: declared

# ADR-0226. The attacker is FRESH by construction: `tools: []` (ADR-0223) means it sees its input
# and nothing else -- not the repo, not the session that wrote the code. On claude-code that is
# `--tools "" --strict-mcp-config`; on generic-api the endpoint has no tools to begin with.
#
# Every input is inlined content, never a reference, for the reason build-in-public-draft gives:
# a process with no tools cannot resolve a reference, and the data boundary (ADR-0219) scans the
# INPUT before any driver starts -- a boundary that inspects a pointer is not inspecting the data.
# `classification` rides the input so that boundary reads a declaration, not a substring.
#
# There is no `compile:` block. A generated command would be this attacker prompt; the command
# people run is the hand-written /arc-attack, which calls arc-attack.mjs.
#
# The body carries NO `{{input.X}}` placeholder, on purpose. Placeholders are rendered only by
# arc-compile; the drivers hand `body` to the model verbatim, so an uncompiled process that used
# one sent the model the literal text `{{input.surface}}` (logic attack L4). The surface travels in
# the INPUT, and the body says where to read it.
inputs:
  - name: classification
    type: string
    required: true
    description: "external-ok | internal-only (data boundary, ADR-0219)"
  - name: surface
    type: string
    required: true
    description: "logic | boundary"
  - name: diff
    type: string
    required: true
    description: "unified diff under attack"
  - name: defect_patterns
    type: string
    required: true
    description: "pattern and rule of every fixed-defects row, none dropped"
  - name: prior_findings
    type: string
    required: false
    default: ""
    description: "round-1 findings; round 2 attacks the fixes"
tools: []
output:
  type: object
  additionalProperties: false
  required:
    - surface
    - findings
  properties:
    surface:
      type: string
      enum:
        - logic
        - boundary
    findings:
      type: array
      items:
        type: object
        additionalProperties: false
        required:
          - id
          - severity
          - where
          - breaking_input
          - why
          - fix
        properties:
          id:
            type: string
            pattern: "^[LB][0-9]{1,3}$"
          severity:
            type: string
            enum:
              - critical
              - high
              - medium
              - low
          where:
            type: string
            minLength: 1
          breaking_input:
            type: string
            minLength: 1
          why:
            type: string
            minLength: 1
          fix:
            type: string
            minLength: 1
          twin_of:
            type: string
evals:
  - tests/fixtures/engine/evals/attack-diff/logic-basic.json
  - tests/fixtures/engine/evals/attack-diff/boundary-basic.json
baseline:
  waived: capability-gap
  why: "the attacker pass has only ever run as general-purpose agents inside the building session, never as a command, so there is no prior command to pin against; a pin would be fabricated"
  recorded: 2026-09-23

body: |
  You are a FRESH adversarial attacker. You never saw this code being written; the input is all you have.

  Attack ONLY the surface named in the input's `surface` field:
  - logic: decisions, validation, parsing, state checks, "validate one read, use another".
  - boundary: process spawn, argument quoting, paths, Windows vs POSIX, git and branch writes, locks, exit codes, pipes closed early.

  For EVERY line in defect_patterns, check whether the same pattern appears in ANY changed file (a twin). Report a twin with `twin_of` set to that pattern.

  Each finding needs a concrete breaking input, not a worry. No praise, no summary of the code. At most 15 findings; an empty list is a valid answer.

  If prior_findings is non-empty, attack the FIXES: is each fix real, or did a test get weaker, an assertion get skipped, a check move?

  Reply with ONE JSON object and nothing else:
  {"surface": "logic" or "boundary", "findings": [{"id": "L1" for logic or "B1" for boundary, "severity": "critical|high|medium|low", "where": "file:line", "breaking_input": "...", "why": "...", "fix": "...", "twin_of": "optional"}]}
