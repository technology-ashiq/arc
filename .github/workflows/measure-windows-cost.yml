name: measure-windows-cost

# THROWAWAY. Manual only, gates nothing, not part of arc-ci. Delete once its question is
# answered and the answer is written into ci.yml.
#
#   gh workflow run measure-windows-cost.yml
#   gh run view <id> --log | grep -E 'par:'
#
# ALREADY ANSWERED, by the first version of this file (run 30611012771). Kept here because the
# next person to ask will otherwise re-run them:
#
#   Microsoft Defender exclusions -- NO EFFECT, and the reason is not "Defender is innocent".
#   121s vs 119s on a one-file shard, 186s vs 193s on a five-file shard, both inside the spread
#   between two repetitions of the SAME variant. The verification step explained it: the
#   windows-latest image already ships with realtime protection off and both drives excluded.
#   The lever was pulled before we reached for it. Without that check the numbers would have
#   read as "process spawn is not Defender's fault", which is a different and wrong claim.
#
#   The four unweighted files -- lane-resolver 122s (44 tests), shard-tests 49s, lane-surfaces
#   40s, root-golden 19s, all of which had been packing at _default_weight 16. Written into
#   tests/shard-timings.json.
#
#   The concurrent-job cap -- 20, measured. A 25-job run left exactly five queueing (150s, 85s,
#   71s, 55s, 43s).
#
#   `bats --jobs` -- NOT MEASURABLE. It needs GNU parallel, Git Bash does not ship it, and
#   fetching the perl script onto the runner did not land.
#
# THE REMAINING QUESTION
# ----------------------
# After the rebalance, arc-ci is ~2m43 and UBUNTU sets the wall clock at ~163s unsharded.
# Sharding ubuntu costs three jobs (all three node legs run the full suite) and, against a cap
# of 20, forces windows from 12 shards down to 11 -- which comes out slower. The budget is the
# binding constraint, so the only way further down is to make a windows shard do more work per
# JOB rather than to buy more jobs.
#
# A windows runner has 4 cores and bats uses one. `bats --jobs` is out, but nothing stops a
# shard from running several bats processes at once with plain `&` and `wait` -- no GNU
# parallel, no new dependency. If that scales even 2x, 12 shards become ~6 and the freed budget
# is enough to shard ubuntu, which is what actually caps the run today.
#
# So: does concurrency inside one job buy time on a 4-core windows runner, or does it only
# create contention? The cost is bats-spawns-a-process, and whether that parallelises is not
# something to reason about from first principles.
#
#   serial   one `bats` call over all four files          <- the control
#   par2     two concurrent calls, two files each
#   par4     four concurrent calls, one file each
#
# Four files of deliberately SIMILAR measured cost (42s, 42s, 40s, 35s = 159s serial), because
# a split into wildly uneven groups measures the split, not the parallelism. Perfect scaling
# would be ~80s at par2 and ~42s at par4.
#
# CORRECTNESS IS PART OF THE MEASUREMENT, NOT A FOOTNOTE. Concurrency is only worth having if
# the suite still runs correctly under it, so every job reconciles the TAP lines emitted across
# all groups against the `@test` lines the four files declare, and reports the worst exit code
# any group returned. A parallel variant that is fast and red, or fast and short, is a NO --
# and short is the one that hides, which is why the count is checked rather than trusted.
#
# Two repetitions. An effect smaller than the spread between repetitions of the same variant is
# reported as no effect, not as a win.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  par:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: serial, rep: 1 }
          - { mode: serial, rep: 2 }
          - { mode: par2,   rep: 1 }
          - { mode: par2,   rep: 2 }
          - { mode: par4,   rep: 1 }
          - { mode: par4,   rep: 2 }
    name: par ${{ matrix.mode }} rep${{ matrix.rep }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats
        run: npm install -g bats
      - name: Install jq
        run: choco install jq -y --no-progress

      # Scanners are installed because their absence makes tests SKIP, and a skipped test is
      # cheap in a way the real run is not. products.bats and bytediff.bats are not scanner
      # files, but the group must behave like a real shard rather than a lighter one.
      - name: Install gitleaks (best-effort)
        run: |
          set -u; VER=8.30.1; mkdir -p "$HOME/bin"
          curl -fsSL -o gl.zip "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_windows_x64.zip" \
            && unzip -o gl.zip gitleaks.exe -d "$HOME/bin" || echo "gitleaks install skipped"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install opengrep (best-effort)
        run: |
          set -u; mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/opengrep.exe" \
            https://github.com/opengrep/opengrep/releases/download/v1.26.0/opengrep_windows_x86.exe \
            || echo "opengrep install skipped"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Cores
        # Block scalar, not an inline one: `run: echo "par: cores=..."` is not valid YAML --
        # the colon-space inside makes the parser read a nested mapping.
        run: |
          echo "par: cores=$(nproc 2>/dev/null || echo unknown)"

      - name: Run the four files and time them
        run: |
          set -u
          A=tests/products.bats       # 42s
          B=tests/spine-inbox.bats    # 42s
          C=tests/lane-surfaces.bats  # 40s
          D=tests/bytediff.bats       # 35s
          for f in "$A" "$B" "$C" "$D"; do
            [ -f "$f" ] || { echo "::error::$f does not exist -- the file set is stale"; exit 1; }
          done
          out="$RUNNER_TEMP/par"; rm -rf "$out"; mkdir -p "$out"

          # GitHub runs `shell: bash` as `bash -eo pipefail`, so every line below is written to
          # survive that. A failing bats is DATA here, not an abort -- the whole point is to
          # record which mode broke the suite -- so the run is wrapped in `set +e` and its
          # status written to a file. `wait` is guarded for the same reason: it returns the
          # failure of a background job and would otherwise kill the step before the numbers
          # are printed.
          #
          # One group per bats process, each with its own TAP file and its own exit code. A
          # group whose shell dies leaves NO rc file, which is checked below -- with a shared
          # log and a bare `wait` that group would simply vanish and read as success.
          group() {
            local tag="$1"; shift
            set +e
            bats "$@" > "$out/tap-$tag.log" 2>&1
            printf '%s\n' "$?" > "$out/rc-$tag"
            set -e
          }

          t0=$(date +%s)
          case "${{ matrix.mode }}" in
            serial) group all "$A" "$B" "$C" "$D" ;;
            par2)   group g1 "$A" "$B" & group g2 "$C" "$D" & wait || true ;;
            par4)   group g1 "$A" & group g2 "$B" & group g3 "$C" & group g4 "$D" & wait || true ;;
            *)      echo "::error::unknown mode"; exit 1 ;;
          esac
          elapsed=$(( $(date +%s) - t0 ))

          # Worst exit code across the groups, and a missing rc file counts as a failure rather
          # than as nothing -- a group whose shell died would otherwise leave no trace.
          case "${{ matrix.mode }}" in
            serial) expected_groups=1 ;;
            par2)   expected_groups=2 ;;
            par4)   expected_groups=4 ;;
          esac
          got_groups="$(find "$out" -name 'rc-*' | wc -l | tr -d ' ')"
          worst=0
          for r in "$out"/rc-*; do
            v="$(cat "$r")"
            if [ "$v" -gt "$worst" ]; then worst="$v"; fi
          done
          if [ "$got_groups" -ne "$expected_groups" ]; then worst=99; fi

          # grep -c exits 1 on a file with no matches, and pipefail would turn that into a dead
          # step rather than a count of zero -- which is the number worth seeing.
          declared="$({ grep -hcE '^[[:blank:]]*@test[[:blank:]]' "$A" "$B" "$C" "$D" || true; } | awk '{s+=$1} END{print s+0}')"
          executed="$(cat "$out"/tap-*.log | grep -cE '^(ok|not ok) ' || true)"
          warned="$(cat "$out"/tap-*.log | grep -cE '^# bats warning:' || true)"

          echo "par: mode=${{ matrix.mode }} rep=${{ matrix.rep }} elapsed=${elapsed}s groups=$got_groups/$expected_groups worst_rc=$worst declared=$declared executed=$executed warnings=$warned"

          # Speed is only a result if the run was also correct and complete. A parallel variant
          # that finishes early because two of its tests never ran is the exact failure this
          # whole exercise exists to avoid.
          if [ "$worst" -ne 0 ] || [ "$declared" -ne "$executed" ] || [ "$warned" -ne 0 ]; then
            echo "par: VERDICT=unusable -- ${{ matrix.mode }} did not run the suite correctly"
            cat "$out"/tap-*.log | grep -E '^(not ok|# bats warning:)' | head -20 || true
            exit 1
          fi
          echo "par: VERDICT=clean"
