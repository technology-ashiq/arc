name: arc-ci

# The one-Linux PR gate (ci lane, ADR-2201..2204). The owner's Windows box is the first gate
# (pre-push); this confirms on ubuntu + Node 24. Windows and docker are proven weekly, not per push.
#
# Required checks are the stable job names quality, test, security, face and ci-tier (ADR-2204).
# `test` aggregates the bats shards and node-test, so the shard count can change -- and bats can
# disappear -- without touching branch protection. Path filtering is job-level `if:` from the
# `changes` job, never workflow-level `paths`: a required workflow that never starts leaves a PR
# pending forever, and a skipped job counts as passing, so `changes` fails OPEN on any doubt.
# Logic lives in .claude/scripts/core/ci-*.{mjs,sh}, not in YAML.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: arc-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changes:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      face: ${{ steps.paths.outputs.face }}
      citier: ${{ steps.paths.outputs.citier }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - id: paths
        run: node .claude/scripts/core/ci-changes.mjs --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha || github.sha }}" | tee -a "$GITHUB_OUTPUT"

  quality:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Version gate
        run: bash .claude/scripts/review/arc-scan/version-gate.sh
      - name: Product manifests lint
        run: node .claude/scripts/core/product-lint.mjs

  bats:
    name: bats (${{ matrix.shard }})
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install tools
        run: bash .claude/scripts/core/ci-install-tools.sh
      - name: Run bats shard
        # index and total come from the matrix itself, so every file lands in exactly one shard (attack B4).
        run: bash .claude/scripts/core/ci-bats-shard.sh ${{ strategy.job-index }} ${{ strategy.job-total }}

  node-test:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: node --test
        run: |
          n="$(find tests -name '*.test.mjs' | wc -l | tr -d ' ')"
          lanes="$(find tests -mindepth 2 -maxdepth 2 -name .count | wc -l | tr -d ' ')"
          echo "node:test: $n file(s), $lanes lane(s) migrated"
          if [ "$n" -eq 0 ] && [ "$lanes" -eq 0 ]; then exit 0; fi
          node --test --test-reporter=tap "tests/**/*.test.mjs" 2>&1 | tee "$RUNNER_TEMP/node-test.tap"
          rc=${PIPESTATUS[0]}
          [ "$rc" -eq 0 ] || exit "$rc"
          ran="$(sed -n 's/^# tests \([0-9]*\)$/\1/p' "$RUNNER_TEMP/node-test.tap" | tail -1)"
          [ -n "$ran" ] && [ "$ran" -gt 0 ] || { echo "::error::node --test reported no tests run"; exit 1; }
          # A .count is a claim; the runner's REPORTED total must cover it, or the floor counts tests
          # that never ran (attack r2 B1/L4/L7, fixed-defect h). Per-lane: migrate-guard, Phase 02.
          claimed="$(find tests -mindepth 2 -maxdepth 2 -name .count -exec cat {} + | tr -d '\r' | awk '{s+=$1} END{print s+0}')"
          echo "node:test reported $ran, .count files claim $claimed"
          [ "$ran" -ge "$claimed" ] || { echo "::error::node --test ran $ran, below the $claimed the .count files claim"; exit 1; }

  test:
    needs: [changes, quality, bats, node-test]
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test job succeeded
        run: |
          for r in "changes=${{ needs.changes.result }}" "quality=${{ needs.quality.result }}" \
                   "bats=${{ needs.bats.result }}" "node-test=${{ needs.node-test.result }}"; do
            echo "$r"
            [ "${r#*=}" = "success" ] || { echo "::error::${r%%=*} did not succeed (${r#*=})"; exit 1; }
          done
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Test-count floor
        run: node .claude/scripts/core/ci-floor.mjs

  security:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Install tools
        run: bash .claude/scripts/core/ci-install-tools.sh
      - name: Scanners are present
        # arc-scan reports a missing tool as SKIPPED with exit 0, so a failed download would pass.
        run: command -v gitleaks && command -v opengrep && command -v jq
      - name: arc-scan over the PR diff
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -n "$base" ]; then bash .claude/scripts/review/arc-scan/arc-scan.sh --base "$base" --no-stamp --out-dir "$RUNNER_TEMP/scan"
          else bash .claude/scripts/review/arc-scan/arc-scan.sh --all --no-stamp --out-dir "$RUNNER_TEMP/scan"; fi
      - name: npm audit (face)
        working-directory: face
        run: npm audit --audit-level=high

  face:
    needs: changes
    if: ${{ needs.changes.outputs.face != 'false' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: face
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build

  ci-tier:
    needs: changes
    if: ${{ needs.changes.outputs.citier != 'false' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft != true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build the arc-tools image
        run: bash .claude/scripts/review/arc-tools-image.sh build

      - name: Verify trivy runs inside the image
        run: bash .claude/scripts/review/arc-tools-image.sh verify

      - name: Trivy docker rung catches a real vulnerable dependency
        run: |
          set -euo pipefail
          REF="$(bash .claude/scripts/review/arc-tools-image.sh ref)"
          fx="$(mktemp -d)"
          # PyYAML 5.1 -> CVE-2020-1747 (well-known, stable in the trivy DB).
          printf 'PyYAML==5.1\n' > "$fx/requirements.txt"
          # The image runs as non-root (uid 10001); mktemp -d is 0700, so make the
          # mounted fixture world-readable or the container user can't read /src.
          # (Real repo checkouts are already world-readable -- fixture-only fix.)
          chmod -R a+rX "$fx"
          out="$(mktemp)"
          ARC_DOCKER_IMAGE="$REF" ARC_FORCE_RUNTIME=docker ROOT="$fx" \
            bash .claude/scripts/review/arc-scan/adapters/trivy.sh /dev/null "$out"
          n="$(jq '[.runs[].results[]?] | length' "$out")"
          echo "trivy (real image) reported $n vulnerability finding(s)"
          if [ "$n" -eq 0 ]; then
            echo "::warning::0 findings -- mount/readability diagnostic:"
            docker run --rm -v "$fx:/src:ro" "$REF" sh -c 'id; ls -la /src; cat /src/requirements.txt || echo CANNOT-READ-SRC' || true
          fi
          jq -r '.runs[].results[]?.ruleId' "$out" | sort -u | head
          [ "$n" -gt 0 ] || { echo "expected >=1 finding from a vulnerable dep"; exit 1; }
